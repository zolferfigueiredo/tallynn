name: Checks
# Every pull request: the scripts, the tests and the release build with warnings as errors, and a change to the app
# has to raise its version, or merging it releases nothing (release.sh skips a version already released). Like the
# release, it runs on the self-hosted runner on z's Mac: the repository is private, and GitHub's Macs bill minutes.
on:
  pull_request:

# A newer push to the same pull request replaces the run.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Build, test and version
    runs-on: [self-hosted, macOS, release]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the version check compares with the base branch
      - run: shellcheck build.sh release.sh run.sh .githooks/pre-commit
      # Built in a fresh folder each run, like build.sh, so no other project's module cache gets in.
      - name: Tests and the release build, any warning an error
        run: |
          work=$(mktemp -d /tmp/tallynn-ci.XXXXXX)
          trap 'rm -rf "$work"' EXIT
          export TMPDIR="$work/tmp" SWIFTPM_MODULECACHE_OVERRIDE="$work/modules" CLANG_MODULE_CACHE_PATH="$work/modules"
          mkdir -p "$TMPDIR"
          opts=(--scratch-path "$work/build" --cache-path "$work/cache" --config-path "$work/config" --security-path "$work/security" --manifest-cache none)
          swift test -Xswiftc -warnings-as-errors "${opts[@]}"
          swift build -c release -Xswiftc -warnings-as-errors "${opts[@]}"
      - name: A change to the app raises its version
        run: |
          base=origin/${{ github.base_ref }}
          if git diff --quiet "$base"...HEAD -- Sources Package.swift Info.plist Icon; then echo "The app is unchanged."; exit 0; fi
          version() { git show "$1:Info.plist" | sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}'; }
          old=$(version "$base") new=$(version HEAD)
          if [ "$new" = "$old" ] || [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)" != "$new" ]; then
            echo "::error file=Info.plist::The app changed, so CFBundleShortVersionString has to go above $old (it is $new)."
            exit 1
          fi
          echo "$old -> $new"
