name: Checks
# Every pull request and push to main, on GitHub's Mac: the scripts, the tests and the release build with warnings as
# errors. A change to the app has to raise its version, or merging it releases nothing (release.sh skips a version
# already released), and the cask has to install that version.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch replaces the run.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Build, test and version
    # Package.swift needs Swift 6.2, which ships with Xcode 26.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the version check compares with the base branch
      - name: Shellcheck the scripts
        run: |
          command -v shellcheck >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install shellcheck
          shellcheck build.sh release.sh run.sh dmg/layout.sh .githooks/pre-commit
      # Any compiler warning fails the run.
      - run: swift test -Xswiftc -warnings-as-errors
      - run: swift build -c release -Xswiftc -warnings-as-errors
      - name: A change to the app raises its version
        if: github.event_name == 'pull_request'
        run: |
          base=origin/${{ github.base_ref }}
          if git diff --quiet "$base"...HEAD -- Sources Package.swift Info.plist Icon; then echo "The app is unchanged."; exit 0; fi
          version() { git show "$1:Info.plist" | sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}'; }
          old=$(version "$base") new=$(version HEAD)
          if [ "$new" = "$old" ] || [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)" != "$new" ]; then
            echo "::error file=Info.plist::The app changed, so CFBundleShortVersionString has to go above $old (it is $new)."
            exit 1
          fi
          echo "$old -> $new"
      - name: The cask installs this version
        run: |
          app=$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' Info.plist)
          cask=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/tallynn.rb)
          if [ "$cask" != "$app" ]; then
            echo "::error file=Casks/tallynn.rb::version has to be the app's, $app (it is $cask)."
            exit 1
          fi
