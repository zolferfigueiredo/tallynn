name: Release
# Every push to main whose version isn't released yet becomes a release: the self-hosted runner on z's Mac builds,
# signs, notarizes and publishes it. Nothing runs on GitHub's own machines, which bill minutes on a private repo;
# self-hosted runs are free and use no artifacts. If that ever changes, ./release.sh by hand does the same.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:  # builds only, so a change to the release can be tried before it merges
    paths: [release.sh, build.sh, Icon/**, dmg/layout.DS_Store, .github/workflows/release.yml]
permissions:
  contents: write
# Per ref, so a pull request's trial never waits behind or cancels a release.
concurrency:
  group: release-${{ github.ref }}
jobs:
  release:
    name: ${{ github.event_name == 'pull_request' && 'Build the DMG, as a trial' || 'Build, sign, notarize and publish' }}
    runs-on: [self-hosted, macOS, release]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The tests, the universal app and the DMG, signed ad hoc: no Developer ID, notarizing or release.
      - if: github.event_name == 'pull_request'
        run: ./build.sh
      # No GH_TOKEN: gh uses z's own login on this Mac, so the release is zolferfigueiredo's, not github-actions[bot]'s.
      - if: github.event_name != 'pull_request'
        run: ./release.sh
